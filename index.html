const INITIAL={view:'home',page:1,term:'',year:'',genre:'',sort:'POPULARITY_DESC',busy:false,items:[],hasNextPage:false,home:null,selected:null,activeVideo:null,requestToken:0};

const cache=new Map();const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const track=list=>{for(const m of list){mediaIndex[m.id]=m}const keys=Object.keys(mediaIndex);if(keys.length>180){for(const k of keys.slice(0,keys.length-180)){if(!favorites.includes(k)&&!episodeURLs[k])delete mediaIndex[k]}}remember()};

async function graphql(query,variables){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});if(!r.ok)throw Error('API gagal: '+r.status);const j=await r.json();if(j.errors?.length)throw Error(j.errors[0].message);return j.data}
const FIELDS='id title { romaji english native } startDate { year } seasonYear format episodes countryOfOrigin averageScore popularity genres description(asHtml:false) coverImage { large medium extraLarge } bannerImage trailer { id site thumbnail } streamingEpisodes { title thumbnail url site } externalLinks { site url type language } siteUrl';
const HOME_QUERY=`query { anime:Page(page:1,perPage:14){media(type:ANIME,countryOfOrigin:JP,isAdult:false,sort:[TRENDING_DESC,POPULARITY_DESC]){${FIELDS}}} donghua:Page(page:1,perPage:14){media(type:ANIME,countryOfOrigin:CN,isAdult:false,sort:[POPULARITY_DESC]){${FIELDS}}} movie:Page(page:1,perPage:14){media(type:ANIME,format:MOVIE,isAdult:false,sort:[POPULARITY_DESC]){${FIELDS}}} }`;
const LIST_QUERY=`query($page:Int,$country:CountryCode,$format:MediaFormat,$search:String,$date:String,$genre:[String],$sort:[MediaSort]){Page(page:$page,perPage:24){pageInfo{hasNextPage}media(type:ANIME,countryOfOrigin:$country,format:$format,search:$search,startDate_like:$date,genre_in:$genre,isAdult:false,sort:$sort){${FIELDS}}}}`;
const DETAIL_QUERY=`query($id:Int){Media(id:$id,type:ANIME){${FIELDS}}}`;
function fallbackFor(type='anime'){return fallback.filter(x=>type==='search'?true:type==='movie'?x.format==='MOVIE':(x.countryOfOrigin===(type==='donghua'?'CN':'JP')&&x.format!=='MOVIE'))}
function filterFallback(type){let a=fallbackFor(type);if(state.term)a=a.filter(x=>name(x).toLowerCase().includes(state.term.toLowerCase()));if(state.year)a=a.filter(x=>String(year(x))===state.year);if(state.genre)a=a.filter(x=>x.genres.includes(state.genre));if(state.sort==='SCORE_DESC')a.sort((a,b)=>(b.averageScore||0)-(a.averageScore||0));if(state.sort==='START_DATE_DESC')a.sort((a,b)=>year(b)-year(a));return a}
function toggleFav(id){id=String(id);favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];remember();$('#favCounter').textContent=favorites.length;if(state.selected){renderModal(state.selected)}renderView()}
function setView(view){state.view=view;state.page=1;state.year='';state.genre='';state.term='';state.sort='POPULARITY_DESC';$('#searchBox').value='';$('#sidebar').classList.remove('open');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));renderView();if(['home','anime','donghua','movie'].includes(view))loadData();window.scrollTo({top:0,behavior:'smooth'});location.hash=view}
function homePage(){const sections=state.home||{anime:fallbackFor('anime'),donghua:fallbackFor('donghua'),movie:fallbackFor('movie')};const featured=sections.anime[0]||fallback[0];const desc=clean(featured.description)||'Temukan cerita epik dan petualangan tak terlupakan.';return `<section class="hero"><div class="heroBlob"></div><div class="heroVisual">${featured.bannerImage||featured.coverImage?.extraLarge||featured.coverImage?.large?`<img alt="" src="${esc(featured.bannerImage||featured.coverImage?.extraLarge||featured.coverImage?.large)}">`:''}</div><div class="heroText"><span class="kicker">✦ Pilihan untuk kamu</span><h1>${esc(name(featured))}</h1><div class="meta"><span>★ ${featured.averageScore?(featured.averageScore/10).toFixed(1):'Pilihan'}</span><span>${year(featured)}</span><span>${kindLabel(featured)}</span></div><p>${esc(desc)}</p><div class="heroControls"><button class="btn primary" data-open="${featured.id}">${svgPlay} Lihat Detail</button><button class="btn secondary" data-nav="anime">Jelajahi Katalog →</button></div></div></section><section class="section">${heading('🔥 Anime Populer','Dari Jepang, untuk penggemar anime','anime')}<div class="grid">${sections.anime.slice(0,7).map(card).join('')}</div></section><section class="section">${heading('🐉 Donghua Favorit','Animasi China yang wajib kamu kenal','donghua')}<div class="grid">${sections.donghua.slice(0,7).map(card).join('')}</div></section><section class="section">${heading('🎬 Koleksi Movie','Film anime dan donghua','movie')}<div class="grid">${sections.movie.slice(0,7).map(card).join('')}</div></section><div class="notice"><strong>Mode katalog + player pribadi.</strong> Poster, judul, dan tahun rilis diambil dari AniList saat internet tersedia. Untuk menonton, gunakan trailer yang tersedia, tautan platform resmi, atau masukkan video yang kamu miliki izin untuk putar.</div>`}
function titleForView(){return {search:['Hasil Pencarian','Cari anime, donghua, dan movie sekaligus'],anime:['Anime Jepang','Serial & judul anime dari Jepang'],donghua:['Donghua China','Serial animasi dari China'],movie:['Movie Anime & Donghua','Film animasi dari Jepang dan China'],watchlist:['Daftar Favorit','Judul yang kamu simpan'],playlist:['Playlist Saya','Judul yang kamu tambahkan video/episode'],settings:['Pengaturan Website','Ubah identitas website versi kamu']}[state.view]}
function categoryPage(){const [title,sub]=titleForView();const genres=['Action','Adventure','Comedy','Drama','Fantasy','Romance','Slice of Life','Mystery','Sports','Sci-Fi','Supernatural'];const controls=`<div class="controls"><select id="yearSelect" class="field" aria-label="Filter tahun"><option value="">Semua Tahun</option>${Array.from({length:2027-1980},(_,i)=>2026-i).map(y=>`<option value="${y}" ${state.year===String(y)?'selected':''}>${y}</option>`).join('')}</select><select id="genreSelect" class="field" aria-label="Filter genre"><option value="">Semua Genre</option>${genres.map(g=>`<option value="${g}" ${state.genre===g?'selected':''}>${g}</option>`).join('')}</select><select id="sortSelect" class="field" aria-label="Urutkan"><option value="POPULARITY_DESC" ${state.sort==='POPULARITY_DESC'?'selected':''}>Terpopuler</option><option value="SCORE_DESC" ${state.sort==='SCORE_DESC'?'selected':''}>Rating Tertinggi</option><option value="START_DATE_DESC" ${state.sort==='START_DATE_DESC'?'selected':''}>Terbaru</option></select></div>`;const items=state.items;return `<section class="section" style="margin-top:8px">${heading(title,sub)}${controls}${state.busy?`<div class="grid">${showLoad()}</div>`:items.length?`<div class="grid">${items.map(card).join('')}</div>${state.hasNextPage?`<div class="loadMore"><button class="btn outline" id="loadMore">Muat lebih banyak ↓</button></div>`:''}`:`<div class="empty"><div class="emoji">🔎</div><strong>Belum ada judul ditemukan</strong><p>Coba ganti tahun, genre, atau kata kunci pencarian.</p><button class="btn outline" id="resetFilter">Hapus filter</button></div>`}</section>`}
function localCategory(){let list=[];if(state.view==='watchlist')list=favorites.map(getStoreItem).filter(Boolean);else list=Object.keys(episodeURLs).filter(id=>episodeURLs[id]?.length).map(getStoreItem).filter(Boolean).concat(Object.keys(localFiles).filter(id=>localFiles[id]?.length&&!episodeURLs[id]?.length).map(getStoreItem).filter(Boolean));if(state.term)list=list.filter(m=>name(m).toLowerCase().includes(state.term.toLowerCase()));return list}
function savedPage(){const [title,sub]=titleForView(),items=localCategory();return `<section class="section" style="margin-top:8px">${heading(title,sub)}<div class="statRow"><div class="stat"><strong>${state.view==='watchlist'?favorites.length:items.length}</strong><span>${state.view==='watchlist'?'judul favorit':'judul punya playlist'}</span></div></div><div style="height:24px"></div>${items.length?`<div class="grid">${items.map(card).join('')}</div>`:`<div class="empty"><div class="emoji">${state.view==='watchlist'?'💜':'🎞️'}</div><strong>${state.view==='watchlist'?'Daftar favorit masih kosong':'Playlist masih kosong'}</strong><p>${state.view==='watchlist'?'Klik ikon hati pada poster untuk menyimpannya.':'Buka detail sebuah judul, lalu tambahkan video atau berkas episode milikmu.'}</p><button class="btn primary" data-nav="anime">Jelajahi Anime</button></div>`}</section>`}
function settingsPage(){return `<section class="section" style="margin-top:8px">${heading(...titleForView())}<div class="pane" style="max-width:580px"><h4>Nama website</h4><p>Buat website ini lebih personal sesuai nama yang kamu suka.</p><form id="brandForm" class="settingsForm"><input class="field" name="brand" value="${esc(brand)}" maxlength="28" required placeholder="Contoh: AnimeVerse"/><button class="btn primary" type="submit">Simpan nama</button></form><p class="help" style="margin-top:16px">Data favorit dan alamat video disimpan di browser perangkat ini. Jika riwayat browser dibersihkan, datanya bisa hilang. File lokal perlu dipilih lagi ketika membuka ulang website.</p></div><div class="notice"><strong>Ingin website benar-benar online?</strong> File ini bisa diunggah ke hosting statis. Jika nanti ada banyak pengguna, database, akun, dan penyimpanan video akan membutuhkan layanan server.</div></section>`}
function renderView(){initBrand();$('#favCounter').textContent=favorites.length;if(state.view==='home')$('#content').innerHTML=homePage();else if(['search','anime','donghua','movie'].includes(state.view))$('#content').innerHTML=categoryPage();else if(['watchlist','playlist'].includes(state.view))$('#content').innerHTML=savedPage();else $('#content').innerHTML=settingsPage()}
async function loadData(){const token=++state.requestToken;if(state.view==='home'){
try{const v=cache.get('home')||await graphql(HOME_QUERY,{});if(token!==state.requestToken)return;cache.set('home',v);state.home={anime:v.anime.media.filter(x=>x.format!=='MOVIE'),donghua:v.donghua.media.filter(x=>x.format!=='MOVIE'),movie:v.movie.media};for(const k in state.home){if(state.home[k].length===0)state.home[k]=fallbackFor(k)}track(Object.values(state.home).flat());renderView()}catch(e){if(token!==state.requestToken)return;state.home={anime:fallbackFor('anime'),donghua:fallbackFor('donghua'),movie:fallbackFor('movie')};track(Object.values(state.home).flat());renderView();toast('Katalog contoh aktif • koneksi AniList tidak tersedia')}return}
if(!['search','anime','donghua','movie'].includes(state.view))return;state.busy=true;renderView();const view=state.view;const q={page:state.page,country:(view==='movie'||view==='search')?null:(view==='donghua'?'CN':'JP'),format:view==='movie'?'MOVIE':null,search:state.term||null,date:state.year?`${state.year}%`:null,genre:state.genre?[state.genre]:null,sort:[state.sort]};const key=JSON.stringify([view,q]);try{const data=cache.get(key)||await graphql(LIST_QUERY,q);if(token!==state.requestToken)return;cache.set(key,data);const items=data.Page.media.filter(m=>(view==='movie'||view==='search')?true:m.format!=='MOVIE');state.items=state.page===1?items:[...state.items,...items];state.hasNextPage=data.Page.pageInfo.hasNextPage;track(state.items)}catch(e){if(token!==state.requestToken)return;if(state.page===1)state.items=filterFallback(view);state.hasNextPage=false;toast('Koneksi katalog gagal, menampilkan contoh offline')}if(token===state.requestToken){state.busy=false;renderView()}}
let searchTimer;$('#searchBox').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.term=e.target.value.trim();state.page=1;if(!['anime','donghua','movie','search'].includes(state.view)){if(state.view==='home'){state.view='search';document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'))}else {renderView();return}}loadData()},420)});

function closeModal(){const vid=$('#videoElement');if(vid)vid.pause();state.activeVideo=null;state.selected=null;$('#backdrop').classList.remove('show');$('#modalContent').innerHTML='';document.body.style.overflow=''}
async function openModal(id){let m=getStoreItem(id);if(!m)return;state.selected=m;state.activeVideo=null;$('#backdrop').classList.add('show');document.body.style.overflow='hidden';renderModal(m);if(m._fallback){const q=String(name(m)).split('(')[0].trim();try{const d=await graphql(`query($search:String){Page(perPage:3){media(type:ANIME,search:$search,isAdult:false){${FIELDS}}}}`,{search:q});if(state.selected?.id===m.id&&d.Page.media?.length){const result=d.Page.media.find(x=>x.countryOfOrigin===m.countryOfOrigin&&x.format===m.format)||d.Page.media[0];if(result){mediaIndex[result.id]=result;const favOld=isFav(m.id),oldURLs=episodeURLs[m.id];if(favOld){favorites=favorites.filter(x=>x!==String(m.id));if(!isFav(result.id))favorites.push(String(result.id))}if(oldURLs&&!episodeURLs[result.id])episodeURLs[result.id]=oldURLs;track([result]);state.selected=result;renderModal(result)}}}catch{}}else if(!m._detailsFetched){try{const r=await graphql(DETAIL_QUERY,{id:Number(m.id)});if(state.selected?.id===m.id&&r.Media){r.Media._detailsFetched=true;track([r.Media]);state.selected=r.Media;renderModal(r.Media)}}catch{}}}
function urlOK(x){try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function ytID(url){if(!url)return null;try{let u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.slice(1);if(u.hostname.endsWith('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();}catch{}return null}
function trailer(m){if(m.trailer?.site==='youtube'&&/^[\w-]{6,}$/.test(m.trailer.id||''))return 'https://www.youtube-nocookie.com/embed/'+m.trailer.id+'?rel=0';return null}
function episodeEntries(m){const id=String(m.id);const entries=(episodeURLs[id]||[]).filter(x=>urlOK(x.url)).map(x=>({...x,source:'url'}));(localFiles[id]||[]).forEach(x=>entries.push({...x,source:'file'}));return entries.sort((a,b)=>Number(a.n)-Number(b.n))}
function videoHTML(m){let active=state.activeVideo;if(!active)return `<div class="player"><div class="playerPlaceholder"><div class="emoji">▶</div><strong>Pemutar video pribadimu</strong><p>Pilih trailer resmi, tautan episode, atau unggah berkas video yang boleh kamu putar.</p></div></div>`;if(active.type==='trailer'){const src=trailer(m);return src?`<div class="player"><iframe title="Trailer resmi" src="${esc(src)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`:''}
if(active.type==='video'&&(active.url?.startsWith('blob:')||urlOK(active.url)))return `<div class="player"><video id="videoElement" src="${esc(active.url)}" controls playsinline autoplay></video></div>`;return `<div class="player"><p>Video tidak ditemukan.</p></div>`}
function renderModal(m){if(!state.selected)return;const entries=episodeEntries(m),desc=clean(m.description)||'Detail cerita belum tersedia.';const image=m.coverImage?.extraLarge||m.coverImage?.large;const official=(m.externalLinks||[]).filter(x=>x.url&&urlOK(x.url)&&['STREAMING','VIDEO'].includes(String(x.type||'').toUpperCase())).slice(0,6);const episodeLinks=(m.streamingEpisodes||[]).filter(x=>x.url&&urlOK(x.url)).slice(0,100);$('#modalContent').innerHTML=`<div class="detailHero">${image?`<img class="detailPoster" alt="Poster ${esc(name(m))}" src="${esc(image)}">`:`<div class="detailPoster" style="display:grid;place-items:center;background:${iconColor(m.id)};font-size:29px;font-weight:900">${esc(name(m).slice(0,2).toUpperCase())}</div>`}<div><span class="kicker">${kindLabel(m)} · ${esc(m.format||'ANIMASI')}</span><h2>${esc(name(m))}</h2><div class="meta"><span>📅 ${year(m)}</span><span>★ ${m.averageScore?(m.averageScore/10).toFixed(1):'—'}</span><span>🎞 ${m.episodes||'?'} ${m.format==='MOVIE'?'film':'episode'}</span><span>${esc((m.genres||[]).slice(0,2).join(' / '))}</span></div><p>${esc(desc)}</p><div class="detailActions"><button class="btn primary" id="modalFav">${isFav(m.id)?'♥ Tersimpan':'♡ Simpan Favorit'}</button>${trailer(m)?`<button class="btn secondary" id="playTrailer">${svgPlay} Trailer</button>`:''}${m.siteUrl&&urlOK(m.siteUrl)?`<a class="btn outline" href="${esc(m.siteUrl)}" target="_blank" rel="noopener noreferrer">Detail AniList ↗</a>`:''}</div></div></div><div class="detailBody"><h3>🎬 Tonton & Playlist</h3>${videoHTML(m)}<div class="twoCols"><div class="pane"><h4>Playlist episode pribadi <span class="mini">(${entries.length})</span></h4><p>Gunakan file atau URL video sendiri yang kamu punya hak akses/izin tayang.</p><div class="episodeList" id="episodesArea">${entries.length?entries.map((x,i)=>`<button class="episode" data-play-episode="${i}"><span class="epNum">EP ${esc(x.n)}</span><span class="epTitle">${esc(x.title||'Episode '+x.n)}</span><small>▶</small></button>`).join(''):`<div class="mini">Belum ada episode yang ditambahkan.</div>`}</div><form id="addEpisodeForm" style="margin-top:13px"><div class="formrow"><input class="field" style="max-width:70px;min-width:0" id="epNum" type="number" min="1" required value="${entries.length+1}" title="Nomor episode"><input class="field" id="epURL" type="url" placeholder="https://.../video.mp4" required></div><button class="btn secondary" style="width:100%;margin-top:8px" type="submit">+ Tambahkan URL video</button></form><label class="fileButton">📁 Pilih file video (bisa beberapa)<input type="file" id="videoFiles" accept="video/*" multiple></label><p class="help">File dari perangkat hanya dapat diputar selama halaman terbuka. Video berformat MP4/WebM paling kompatibel; tautan platform yang tidak mendukung pemutaran langsung tidak akan berfungsi di player.</p></div><div class="pane"><h4>🌐 Sumber resmi</h4><p>Tautan di bawah berasal dari metadata judul. Ketersediaan tayangan tergantung wilayah, lisensi, dan langganan.</p><div class="episodeList">${official.map(x=>`<a class="episode" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="epTitle">↗ ${esc(x.site)}</span></a>`).join('')}${episodeLinks.map(x=>`<a class="episode" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="epTitle">↗ ${esc(x.title||x.site||'Episode resmi')}</span></a>`).join('')}${episodeLinks.length?`<p class="help">Tersedia ${episodeLinks.length} tautan episode resmi yang tercatat.</p>`:''}${!official.length&&!episodeLinks.length?`<div class="mini">Tidak ada tautan streaming yang terdaftar untuk judul ini.</div>`:''}</div>${trailer(m)?`<button class="btn outline" id="trailerButton" style="width:100%;margin-top:12px">▶ Putar trailer</button>`:''}<p class="help" style="margin-top:14px">Website ini tidak mengunggah atau menyalin film dan episode berhak cipta tanpa izin.</p></div></div></div>`;
$('#modalFav').addEventListener('click',()=>toggleFav(m.id));['#playTrailer','#trailerButton'].forEach(sel=>{$(sel)?.addEventListener('click',()=>{state.activeVideo={type:'trailer'};renderModal(m)})});$('#addEpisodeForm').addEventListener('submit',e=>{e.preventDefault();const n=Number($('#epNum').value),url=$('#epURL').value.trim();if(!urlOK(url)){toast('URL harus menggunakan http atau https');return}const filename=url.split('?')[0].split('/').pop()||'Episode '+n;const id=String(m.id);episodeURLs[id]||=[];episodeURLs[id]=episodeURLs[id].filter(ep=>Number(ep.n)!==n);episodeURLs[id].push({n,url,title:decodeURIComponent(filename).slice(0,100)});track([m]);renderModal(m);toast('Episode ditambahkan ke playlist')});
$('#videoFiles').addEventListener('change',e=>{const files=[...e.target.files];if(!files.length)return;const id=String(m.id),start=entries.length+1;localFiles[id]||=[];files.forEach((file,i)=>localFiles[id].push({n:start+i,title:file.name,url:URL.createObjectURL(file)}));track([m]);renderModal(m);toast(files.length+' video siap diputar')});
$('#episodesArea')?.addEventListener('click',e=>{const b=e.target.closest('[data-play-episode]');if(!b)return;const entry=episodeEntries(m)[Number(b.dataset.playEpisode)];if(!entry)return;state.activeVideo={type:'video',url:entry.url};renderModal(m);$('#videoElement')?.scrollIntoView({block:'center',behavior:'smooth'})});}

// ARUVERSE V3: history, subtitle tracks, episode navigation (local to this browser).
const v3Key='aruverse_v3_history';
let v3History={};try{v3History=JSON.parse(localStorage.getItem(v3Key)||'{}')||{}}catch{}
const v3Subs={};
function v3Save(){try{localStorage.setItem(v3Key,JSON.stringify(v3History))}catch{}}
function v3Ep(m){const a=state.activeVideo;if(!a||a.type!=='video')return null;return episodeEntries(m).find(x=>x.url===a.url)||null}
function v3PlayIndex(m,i){const e=episodeEntries(m)[i];if(!e)return;state.activeVideo={type:'video',url:e.url};renderModal(m);$('#videoElement')?.scrollIntoView({block:'center',behavior:'smooth'})}
const v3OriginalRender=renderModal;
renderModal=function(m){
 v3OriginalRender(m);
 const body=$('#modalContent .detailBody');if(!body)return;
 const player=$('#modalContent .player');const entries=episodeEntries(m),ep=v3Ep(m),idx=ep?entries.findIndex(x=>x.url===ep.url):-1;
 const history=v3History[String(m.id)];
 if(history&&!ep){const n=document.createElement('div');n.className='v3continue';n.innerHTML=`<div><strong>⏯ Lanjutkan menonton</strong><div class="mini">Episode ${Number(history.n)||1} · ${Math.floor((history.time||0)/60)} menit terakhir</div><div class="v3progress"><i style="width:${Math.max(0,Math.min(100,history.duration?history.time/history.duration*100:0))}%"></i></div></div><button type="button" id="v3Resume">Lanjut ▶</button>`;body.insertBefore(n,body.firstChild);n.querySelector('button').onclick=()=>{const i=entries.findIndex(x=>Number(x.n)===Number(history.n));if(i>=0)v3PlayIndex(m,i);else toast('Tambahkan kembali sumber video episode ini untuk melanjutkan')};}
 const panel=document.createElement('div');panel.className='v3box';panel.innerHTML=`<strong>✨ ARUVERSE V3 · Player Premium</strong><p>${ep?'Sedang menonton Episode '+esc(ep.n):'Pilih episode dari playlist untuk mulai menonton.'} Riwayat tersimpan pada browser perangkat ini.</p><div class="v3bar"><button class="btn secondary" id="v3Prev" ${idx<=0?'disabled':''}>← Episode sebelumnya</button><button class="btn primary" id="v3Next" ${idx<0||idx>=entries.length-1?'disabled':''}>Episode berikutnya →</button><label class="btn outline" style="cursor:pointer">CC Tambah subtitle (.vtt)<input type="file" id="v3SubFile" accept=".vtt,text/vtt" hidden></label><span class="v3tag">Subtitle WebVTT</span></div><p class="help">Subtitle harus berformat .vtt dan tersedia dari sumber yang diizinkan. Video dari layanan ber-DRM tetap dibuka melalui penyedia resminya.</p>`;
 if(player)player.after(panel);else body.prepend(panel);
 panel.querySelector('#v3Prev').onclick=()=>v3PlayIndex(m,idx-1);panel.querySelector('#v3Next').onclick=()=>v3PlayIndex(m,idx+1);
 const vid=$('#videoElement');
 function attachSub(url){if(!vid||!url)return;vid.querySelectorAll('track').forEach(t=>t.remove());const tr=document.createElement('track');tr.kind='subtitles';tr.label='Bahasa Indonesia';tr.srclang='id';tr.src=url;tr.default=true;vid.appendChild(tr);tr.addEventListener('load',()=>{try{tr.track.mode='showing'}catch{}})}
 if(vid&&ep){const old=v3History[String(m.id)];if(old&&Number(old.n)===Number(ep.n)&&old.time>3){vid.addEventListener('loadedmetadata',()=>{if(vid.duration>old.time+3)vid.currentTime=old.time},{once:true})}if(v3Subs[String(m.id)])attachSub(v3Subs[String(m.id)]);let last=0;vid.addEventListener('timeupdate',()=>{if(Date.now()-last<2000)return;last=Date.now();v3History[String(m.id)]={n:ep.n,time:vid.currentTime||0,duration:Number.isFinite(vid.duration)?vid.duration:0,title:name(m),at:Date.now()};v3Save()});vid.addEventListener('ended',()=>{v3History[String(m.id)]={n:ep.n,time:0,duration:vid.duration||0,title:name(m),at:Date.now()};v3Save();if(idx<entries.length-1){const next=panel.querySelector('#v3Next');next.disabled=false;next.textContent='▶ Putar episode berikutnya'}})}
 panel.querySelector('#v3SubFile').onchange=e=>{const file=e.target.files?.[0];if(!file||!file.name.toLowerCase().endsWith('.vtt')){toast('Pilih subtitle .vtt');return}if(v3Subs[String(m.id)])URL.revokeObjectURL(v3Subs[String(m.id)]);v3Subs[String(m.id)]=URL.createObjectURL(file);if(vid){attachSub(v3Subs[String(m.id)]);toast('Subtitle ditambahkan. Aktifkan CC pada pemutar jika perlu.')}else toast('Subtitle disimpan sementara. Pilih episode untuk menampilkannya.')};
};

$('#footerYear').textContent=new Date().getFullYear();initBrand();track(fallback);renderView();loadData();
</script>
</body>
